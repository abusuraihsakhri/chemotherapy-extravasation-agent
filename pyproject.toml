[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chemotherapy-extravasation-agent"
version = "2.1.0"
description = "Reference implementation for antineoplastic extravasation classification, CTCAE v5.0 mapping, and antidote calculations."
readme = "README.md"
authors = [{ name = "NAME" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
chemotherapy-extravasation = "cli:main"

[project.urls]
Repository = "https://github.com/abusuraihsakhri/chemotherapy-extravasation-agent"
Issues = "https://github.com/abusuraihsakhri/chemotherapy-extravasation-agent/issues"

[tool.setuptools]
py-modules = ["chemotherapy_extravasation", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:zarr"
