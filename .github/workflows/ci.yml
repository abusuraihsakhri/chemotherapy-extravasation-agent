name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build
          python -m pip install .

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q chemotherapy_extravasation.py cli.py

      - name: Run test suite
        run: python -m pytest -v

      - name: Build distribution
        run: python -m build

      - name: Run installed CLI smoke tests
        run: |
          chemotherapy-extravasation --help
          chemotherapy-extravasation assess --drug doxorubicin --catheter peripheral_forearm --volume 5 --elapsed 1 --height 175 --weight 70 --pain 4 --json
          chemotherapy-extravasation batch -i sample.csv -o out_smoke.csv

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate browser JavaScript syntax
        run: node --check app.js

      - name: Verify Pages artifact inputs
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s chemotherapy_extravasation.py
          grep -q "pyodide/v314.0.7/full/pyodide.js" index.html
          grep -q "chemotherapy_extravasation.py" app.js
